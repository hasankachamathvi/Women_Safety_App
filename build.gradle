// build.gradle (Project-level) - Top-level build configuration
// This file applies settings common to ALL modules in the project

buildscript {
    // Where to download plugins from
    repositories {
        google()        // Google's Maven repository
        mavenCentral()  // Central Maven repository
    }
    dependencies {
        // Android Gradle Plugin - needed to build Android apps
        classpath "com.android.tools.build:gradle:8.7.3"
        // Required for apply plugin: 'com.google.gms.google-services'
        classpath "com.google.gms:google-services:4.4.4"
    }
}

// Repositories for ALL project modules
allprojects {
    repositories {
        google()        // Google's Maven repository
        mavenCentral()  // Central Maven repository
    }
}

// Task to clean build output folder
task clean(type: Delete) {
    delete rootProject.buildDir
}
