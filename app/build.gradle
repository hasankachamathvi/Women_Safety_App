// app/build.gradle - App-level build configuration
// Defines app settings, SDK versions, and library dependencies

plugins {
    id 'com.android.application'  // This is an Android app (not a library)
}

android {
    namespace 'com.example.yuwathi'  // Package name for the app
    compileSdk 34                     // Android API level to compile against

    defaultConfig {
        applicationId "com.yuwathi.project"  // Must match Firebase Android package name
        minSdk 24                             // Minimum Android version (Android 7.0)
        targetSdk 34                          // Target Android version (Android 14)
        versionCode 1                         // App version number (for updates)
        versionName "1.0"                     // App version name shown to users

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true  // Support vector images on older devices
        }
    }

    buildTypes {
        release {
            minifyEnabled false  // Don't shrink code in release build (for now)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17  // Use Java 17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false  // View binding is disabled (using findViewById instead)
    }

    lint {
        abortOnError false       // Don't stop build on lint warnings
        checkReleaseBuilds false
    }
}

// Libraries (dependencies) used in the app
dependencies {
    // Import the Firebase BoM to keep Firebase SDK versions compatible
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    // Firebase Analytics
    implementation 'com.google.firebase:firebase-analytics'
    // Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'
    // Firebase Firestore (Real-time Database)
    implementation 'com.google.firebase:firebase-firestore'
    // Firebase Realtime Database (for SOS and location)
    implementation 'com.google.firebase:firebase-database'
    // Firebase Storage (for image uploads)
    implementation 'com.google.firebase:firebase-storage'
    // Retrofit for REST API calls (if needed for backend APIs)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    // Coroutines for async operations
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Android core libraries
    implementation 'androidx.core:core:1.9.0'                          // Core Android utilities
    implementation 'androidx.appcompat:appcompat:1.6.1'                // Backward compatibility support
    implementation 'com.google.android.material:material:1.8.0'        // Material Design UI components (buttons, nav bar, etc.)
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'  // Flexible layout system
    implementation 'androidx.recyclerview:recyclerview:1.3.0'          // Scrollable list (for contacts, tips)
    implementation 'androidx.cardview:cardview:1.0.0'                  // Card-style UI components
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0' // Coordinator layout for advanced UI
    implementation 'androidx.core:core-splashscreen:1.0.1'             // Splash screen API

    // Google Maps and Location services
    implementation 'com.google.android.gms:play-services-maps:18.1.0'      // Google Maps
    implementation 'com.google.android.gms:play-services-location:21.0.1'  // GPS/Location tracking

    // Testing libraries
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Apply Google Services only when local Firebase config exists.
def googleServicesFile = file("google-services.json")
if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle("google-services.json not found in app/. Skipping Google Services plugin for this local build.")
}
